<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090e26" />
    <meta
      name="description"
      content="飞机大战：拖动战机，穿过弹幕，收集补给。闯关挑战与无限生存，三档难度，点开即玩。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23090e26'/%3E%3Cpath d='M32 8 14 51 32 42 50 51Z' fill='%2300d4ff'/%3E%3C/svg%3E"
    />
    <title>飞机大战 · 开局游戏</title>
  </head>
  <body>
    <main id="shell">
      <canvas
        id="game"
        tabindex="0"
        aria-label="飞机大战战场，使用 WASD 或方向键四向移动，空格暂停"
      ></canvas>
      <div id="accessible-controls" aria-label="游戏操作"></div>
      <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
      <div id="boot-error" hidden>
        <h1>战机暂时无法起飞</h1>
        <p>请刷新页面重试，或使用较新的浏览器。</p>
        <button onclick="location.reload()">重新加载</button>
      </div>
    </main>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
