name: 检查游戏合集

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 缓存经过校验的官方 Creator 压缩包
        uses: actions/cache@v4
        with:
          path: ~/.cache/game-collection-toolchain
          key: creator-windows-${{ hashFiles('toolchains/cocos.json') }}
      - run: pnpm cocos:install
      - run: pnpm exec playwright install chromium
      - run: pnpm check
      - name: 保存完整站点
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/site/
          include-hidden-files: true
          retention-days: 14
      - name: 保存微信和抖音工程包
        uses: actions/upload-artifact@v4
        with:
          name: all-games-mini-${{ github.sha }}
          path: |
            games/*/dist/weixin/
            games/*/dist/douyin/
          retention-days: 14
      - name: 保存浏览器与原生宿主验证证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            artifacts/
            games/garden-guard/artifacts/
          retention-days: 14
