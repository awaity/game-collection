name: Capture public game references
on:
  push:
    branches: ['chore/reference-capture-*']
    paths: [.github/workflows/reference-capture.yml, scripts/capture-public-references.mjs]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/capture-public-references.mjs
      - name: Save reference evidence to this temporary branch
        run: |
          tar -czf reference-evidence.tar.gz -C artifacts public-references
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-evidence.tar.gz
          git commit -m 'docs(references): 保存公开参考站点采集证据 [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"
